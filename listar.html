<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
        <link rel="stylesheet" href="css/bootstrap.css">
        <style>
    /* Estilo do fundo fora da página */
    html {
      background-color: #e9ecef; 
    }

    /* Estilo do corpo da página centralizado e com bordas */
    body {
      max-width: 960px;          /* Define a largura máxima da página */
      min-height: 100vh;         /* Garante que ocupe a altura inteira da tela */
      margin: 0 auto;            /* Centraliza horizontalmente */
      padding: 20px;             /* Espaço interno para o texto não colar na borda */
      background-color: #ffffff; /* Fundo branco para a área principal */
      border: 2px solid #333333; /* Borda em volta de toda a página */
      box-sizing: border-box;    /* Evita que a borda e o padding estiquem a largura */
    }
    </style>
    <title>Listar Alunos</title>
</head>
<body>

    <div class="container"> 
        <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom"> 
            <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none"> 
                <svg class="bi me-2" width="40" height="32" aria-hidden="true"><use xlink:href="#bootstrap"></use></svg> 
                <span class="fs-4">Escola Jacinto Aquinas Costa</span> </a> 
                <ul class="nav nav-pills"> 
                    <li class="nav-item"><a href="index.html" class="nav-link active" aria-current="page">Início</a></li> 
                </ul> 
        </header> 
</div>
    <h1>Listar Alunos</h1>

    <!--
        FORMULÁRIO DE LISTAGEM (READ)

        action="listar.php" -> AQUI é a chamada do arquivo PHP.
                               Ao clicar no botão, o navegador abre o
                               listar.php, que busca os alunos no banco
                               e mostra todos na tela.

        method="GET"        -> Para apenas CONSULTAR dados usamos GET.
                               (POST fica para cadastrar, atualizar e excluir.)

        Repare que NÃO há campos (<input>): o listar.php não precisa
        receber nenhuma informação, ele só lê a tabela alunos.
    -->
    <form action="listar.php" method="GET">

        <!-- Botão que envia o formulário para o arquivo indicado no action -->
        <button type="submit" class="btn btn-primary btn-lg">Listar todos os alunos</button>

    </form>

    <br>
    <a href="index.html">Voltar ao menu</a>

</body>
</html>
